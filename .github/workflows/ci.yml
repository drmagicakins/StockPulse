# Jobs skip cleanly until backend/ and frontend/ contain a project.
# Backend job: lint, static analysis and tests against real PostgreSQL 18 and Redis service containers.
# The `storage` test group (needs S3-compatible storage) is excluded here and verified locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: stockpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: stockpulse
      DB_USERNAME: stockpulse_app
      DB_PASSWORD: ci-app-password
      DB_OWNER_HOST: 127.0.0.1
      DB_OWNER_PORT: "5432"
      DB_OWNER_DATABASE: stockpulse
      DB_OWNER_USERNAME: stockpulse_owner
      DB_OWNER_PASSWORD: ci-owner-password
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v6
      - id: detect
        working-directory: .
        run: |
          if [ -f backend/composer.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No backend project yet - skipping"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, gd, redis, zip, pcntl
          tools: composer:v2
      - if: steps.detect.outputs.present == 'true'
        run: composer validate --strict
      - if: steps.detect.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress
      - if: steps.detect.outputs.present == 'true'
        run: composer audit
      - name: Create database roles (same script as the local Docker stack)
        if: steps.detect.outputs.present == 'true'
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci-postgres-password
          POSTGRES_USER: postgres
          POSTGRES_DB: stockpulse
          DB_OWNER_PASSWORD: ci-owner-password
          DB_APP_PASSWORD: ci-app-password
        run: bash docker/postgres/init/01-roles-databases.sh
      - name: Application key
        if: steps.detect.outputs.present == 'true'
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"
      - name: Migrate as the owner role
        if: steps.detect.outputs.present == 'true'
        run: php artisan migrate --database=pgsql_owner --force
      - name: Code style (Pint)
        if: steps.detect.outputs.present == 'true'
        run: ./vendor/bin/pint --test
      - name: Static analysis (Larastan)
        if: steps.detect.outputs.present == 'true'
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Tests (Pest)
        if: steps.detect.outputs.present == 'true'
        run: ./vendor/bin/pest --colors=never --exclude-group=storage

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No frontend project yet - skipping"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm run build --if-present
      - if: steps.detect.outputs.present == 'true'
        # Informational for now; becomes a blocking gate in WP 1I.
        continue-on-error: true
        run: npm audit --audit-level=high
