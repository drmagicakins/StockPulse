; PgBouncer in transaction mode: tenant context must use SET LOCAL (never session-level SET).
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
pidfile = /var/run/pgbouncer/pgbouncer.pid
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 5
; Allow server-side prepared statements through the pooler (PgBouncer 1.21+)
max_prepared_statements = 100
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
